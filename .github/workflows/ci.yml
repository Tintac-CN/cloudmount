name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 大陆网络环境开发时本地可用 rsproxy；CI 在 GitHub 上用官方源
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust（check + clippy + test）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # T-25 / 决策 #16：主腿 `cargo test --workspace` 不带 features，而
  # webdav_serve.rs 整文件 `#![cfg(feature = "mock")]` 门控——F-03/F-08/F-09
  # 安全集成测试在主腿从不执行（安全项空绿）。本并列 job 使该套件进入门控。
  rust-mock-features:
    name: Rust（mock feature 集成腿：webdav_serve）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (mock feature)
        run: cargo test --workspace --features cloudmount-daemon/mock
      # windows-only 清单（Linux/macOS 跳过——"三平台绿"非全量覆盖）：
      # - T-09 全腿：cloudmount-sync `pub mod rdc` 整体 #[cfg(windows)]
      #   （cloudmount-sync/src/lib.rs:43-44），Linux 主腿不可编译，非仅句柄子腿；
      # - T-14 flush 共享冲突注入（#[cfg(windows)]）；
      # - cfapi 集成腿（T-01/T-02）在 GH windows runner 因 SyncRoot 注册
      #   失败（0x80070490）自动跳过——该面实际守护只剩单元腿。

  # apps/desktop 为 workspace exclude 独立 cargo 项目（根 Cargo.toml:13）——
  # rust job 的 fmt --all / clippy --workspace 只覆盖 workspace members，对
  # desktop 零效力（desktop-installers gate2 互审实证：desktop fmt dirty 394 行
  # 未被根级命令拦截）。本 job 补死该缺口：命令与 ops-runbook 终验硬门同口径，
  # 构建形态沿 release.yml desktop 步先例（--manifest-path，产物落 apps/desktop/target）。
  # gate1 裁决：独立 job + windows-latest 单腿；fmt/clippy 字面 = B1 裁决的
  # --manifest-path 完整形态（与 prd/test-strategy 同一字面源）。
  desktop:
    name: Desktop（fmt + clippy）
    runs-on: windows-latest
    # 冷编上限护栏：防依赖树/缓存异常导致 runner 长时间占用；首跑实测后按
    # 约 2x 余量调整（调整须 decisions 留痕）。
    timeout-minutes: 60
    # 最小权限：checkout 只需 contents 读；cache 走 runtime token，不受 GITHUB_TOKEN 权限面约束。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # desktop 独立 target 目录（apps/desktop/target）不在 rust job 的 cache key 覆盖内。
      # Swatinem/rust-cache@v2 语义 = $workspace -> $target，target 相对 workspace 解析：
      # `apps/desktop -> target` 即 apps/desktop/target；workspaces 一旦给出，v2 只缓存
      # 列出的 workspace（不连带根 workspace），key 含 desktop Cargo.lock hash（依赖变更自动失效）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - name: Format
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings

  web-ui:
    name: Web UI（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  arm-cross:
    name: 交叉编译（musl 冒烟：aarch64 / x86_64）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 每 target 独立 cache key：x86_64/aarch64 两腿的 build-script 二进制
      # 不能互相复用（cross #724：宿主/容器 glibc 混用会使 aarch64 腿报
      # GLIBC_2.28/2.30 not found——x86_64 腿在宿主编译的 build-script 被
      # aarch64 腿在旧 glibc 容器内复用）。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cross：docker 化交叉编译（自带 musl 工具链镜像，含 ring 所需的 C 编译器）。
      # musl.cc 直接下载在本环境不稳定，故走 cross 预编译镜像。
      - uses: taiki-e/install-action@cross
      - name: Build edge daemon + CLI
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli             --target ${{ matrix.target }} --release
      - name: Smoke test（x86_64 可本机运行）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/cloudmountd --help
          target/${{ matrix.target }}/release/cloudmount --help

  cmflt-host:
    name: cmflt（原生 Rust minifilter：host tests + driver type-check）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: drivers/win
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (pure core + simulator)
        run: cargo clippy -p cmflt-core -p cmflt-flt -p cmflt-sim --all-targets -- -D warnings
      - name: Test (pure core + simulator)
        run: cargo test -p cmflt-core -p cmflt-flt -p cmflt-sim
      # The kernel crate is type-checked only; linking .sys needs the WDK and
      # is validated on a self-hosted/VM driver machine.
      - name: Check driver (no link)
        run: cargo check -p cmflt-driver
      - name: Clippy driver (lib only)
        run: cargo clippy -p cmflt-driver --lib -- -D warnings
      - name: Build user-mode handshake client
        run: cargo build -p cmflt-client
