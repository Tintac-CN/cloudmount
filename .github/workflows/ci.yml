name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 大陆网络环境开发时本地可用 rsproxy；CI 在 GitHub 上用官方源
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust（check + clippy + test）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # T-25 / 决策 #16：主腿 `cargo test --workspace` 不带 features，而
  # webdav_serve.rs 整文件 `#![cfg(feature = "mock")]` 门控——F-03/F-08/F-09
  # 安全集成测试在主腿从不执行（安全项空绿）。本并列 job 使该套件进入门控。
  rust-mock-features:
    name: Rust（mock feature 集成腿：webdav_serve）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (mock feature)
        run: cargo test --workspace --features cloudmount-daemon/mock
      # windows-only 清单（Linux/macOS 跳过——"三平台绿"非全量覆盖）：
      # - T-09 全腿：cloudmount-sync `pub mod rdc` 整体 #[cfg(windows)]
      #   （cloudmount-sync/src/lib.rs:43-44），Linux 主腿不可编译，非仅句柄子腿；
      # - T-14 flush 共享冲突注入（#[cfg(windows)]）；
      # - cfapi 集成腿（T-01/T-02）在 GH windows runner 因 SyncRoot 注册
      #   失败（0x80070490）自动跳过——该面实际守护只剩单元腿。

  web-ui:
    name: Web UI（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  arm-cross:
    name: 交叉编译（musl 冒烟：aarch64 / x86_64）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # cross：docker 化交叉编译（自带 musl 工具链镜像，含 ring 所需的 C 编译器）。
      # musl.cc 直接下载在本环境不稳定，故走 cross 预编译镜像。
      - uses: taiki-e/install-action@cross
      - name: Build edge daemon + CLI
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli             --target ${{ matrix.target }} --release
      - name: Smoke test（x86_64 可本机运行）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/cloudmountd --help
          target/${{ matrix.target }}/release/cloudmount --help

  cmflt-host:
    name: cmflt（原生 Rust minifilter：host tests + driver type-check）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: drivers/win
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (pure core + simulator)
        run: cargo clippy -p cmflt-core -p cmflt-flt -p cmflt-sim --all-targets -- -D warnings
      - name: Test (pure core + simulator)
        run: cargo test -p cmflt-core -p cmflt-flt -p cmflt-sim
      # The kernel crate is type-checked only; linking .sys needs the WDK and
      # is validated on a self-hosted/VM driver machine.
      - name: Check driver (no link)
        run: cargo check -p cmflt-driver
      - name: Clippy driver (lib only)
        run: cargo clippy -p cmflt-driver --lib -- -D warnings
      - name: Build user-mode handshake client
        run: cargo build -p cmflt-client
