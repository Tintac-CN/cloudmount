name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 大陆网络环境开发时本地可用 rsproxy；CI 在 GitHub 上用官方源
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust（check + clippy + test）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web-ui:
    name: Web UI（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  arm-cross:
    name: 交叉编译（aarch64 musl 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # ring（rustls 加密后端）需要目标架构的交叉 C 编译器；
      # musl-tools 只含本机架构，故装 musl.cc 的 aarch64 工具链
      - name: Install aarch64 musl cross toolchain
        run: |
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
      - name: Build edge daemon
        run: cargo build -p cloudmount-daemon --target aarch64-unknown-linux-musl --release
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
