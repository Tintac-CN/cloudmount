name: Release（二进制 + 多架构 Docker 镜像）

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 二进制产物（GitHub Release 附件） ============

  binaries-linux:
    name: Linux musl 静态二进制（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # release 干净构建（同 docker job 注释）
      - uses: taiki-e/install-action@cross
      - name: 交叉编译
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli \
            --target ${{ matrix.target }} --release
      - name: 打包 tarball（含 README 与部署手册）
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cloudmountd dist/
          cp target/${{ matrix.target }}/release/cloudmount dist/
          cp README.md docs/edge.md packaging/systemd/cloudmountd.service \
             packaging/systemd/cloudmountd.default dist/ 2>/dev/null || true
          cd dist && tar czf ../cloudmount-linux-${{ matrix.target }}.tar.gz .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-linux-${{ matrix.target }}
          path: cloudmount-linux-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  binaries-windows:
    name: Windows 二进制（x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build -p cloudmount-daemon -p cloudmount-cli --release
      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target\release\cloudmountd.exe, `
            target\release\cloudmount.exe, `
            README.md `
            -DestinationPath cloudmount-windows-x64.zip
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-windows-x64
          path: cloudmount-windows-x64.zip
          if-no-files-found: error

  # ============ GitHub Release ============

  release:
    name: 创建 GitHub Release
    needs: [binaries-linux, binaries-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 下载二进制产物（只取 binaries，不含 docker digest）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cloudmount-*
          merge-multiple: true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate-release-notes: true
          body: |
            ## CloudMount ${{ github.ref_name }}

            115 网盘同步盘（占位符挂载 + 边缘网关），AGPL-3.0。

            ### 产物
            | 文件 | 平台 | 内容 |
            |---|---|---|
            | `cloudmount-linux-*-musl.tar.gz` | Linux x64 / arm64 | 静态二进制（daemon + CLI）+ systemd unit + 部署手册 |
            | `cloudmount-windows-x64.zip` | Windows x64 | cloudmountd.exe + cloudmount.exe |

            ### 快速开始
            ```bash
            # Linux 边缘网关（WebDAV 出口）
            ./cloudmountd --serve --listen 0.0.0.0:8384 --auth user:pass

            # Windows 占位符挂载（OneDrive 式按需）
            cloudmountd --placeholder-mount --sync-root D:\Cloud
            ```

            Docker：`docker run -p 8384:8384 ghcr.io/${{ github.repository_owner }}/cloudmount:${{ github.ref_name }}`

            详见 [部署手册](https://github.com/${{ github.repository }}/blob/main/docs/edge.md)。

  # ============ Docker 多架构镜像（GHCR） ============

  docker:
    name: Docker 镜像（${{ matrix.platform }}）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # release 干净构建：不用 rust-cache（缓存恢复的宿主构建脚本曾在
      # cross 容器里 glibc 不兼容连坐失败）
      - uses: taiki-e/install-action@cross
      - name: 交叉编译静态产物
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli \
            --target ${{ matrix.target }} --release
      # web-ui 静态资产（Dockerfile COPY web-ui/dist）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: 构建 web-ui
        run: cd web-ui && (npm ci || npm install) && npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（按架构）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/cloudmount,push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ fromJSON(steps.build.outputs.metadata).imageJSON.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传 digest（供合并清单）
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: 合并多架构清单
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 下载 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建并推送合并清单
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/cloudmount:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository_owner }}/cloudmount:latest \
            $(printf 'ghcr.io/${{ github.repository_owner }}/cloudmount@sha256:%s ' *)
