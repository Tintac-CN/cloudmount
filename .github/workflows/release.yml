name: Release（二进制 + 多架构 Docker 镜像）

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 二进制产物（GitHub Release 附件） ============

  binaries-linux:
    name: Linux musl 静态二进制（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # release 干净构建（同 docker job 注释）
      - uses: taiki-e/install-action@cross
      - name: 交叉编译
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli \
            --target ${{ matrix.target }} --release
      - name: 打包 tarball（含 README 与部署手册）
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cloudmountd dist/
          cp target/${{ matrix.target }}/release/cloudmount dist/
          cp README.md docs/edge.md packaging/systemd/cloudmountd.service \
             packaging/systemd/cloudmountd.default dist/ 2>/dev/null || true
          cd dist && tar czf ../cloudmount-linux-${{ matrix.target }}.tar.gz .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-linux-${{ matrix.target }}
          path: cloudmount-linux-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  binaries-windows:
    name: Windows 二进制（x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build -p cloudmount-daemon -p cloudmount-cli --release
      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target\release\cloudmountd.exe, `
            target\release\cloudmount.exe, `
            README.md `
            -DestinationPath cloudmount-windows-x64.zip
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-windows-x64
          path: cloudmount-windows-x64.zip
          if-no-files-found: error

  binaries-macos:
    name: macOS 二进制（aarch64 + x86_64 双 target）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # gate1 Q1：pin macos-15（arm64）单 runner 双 target——顺序步双 target，不采用 matrix
      - name: 编译（aarch64-apple-darwin 原生）
        run: cargo build --release --target aarch64-apple-darwin -p cloudmount-daemon -p cloudmount-cli
      - name: 编译（x86_64-apple-darwin 交叉）
        run: cargo build --release --target x86_64-apple-darwin -p cloudmount-daemon -p cloudmount-cli
      # daemon/cli 两 target 同名异目录：每 target 归集一个产物目录（含 README/edge.md）后各打一个 tar
      # CI 与本地 dry-run 走同一脚本；文档缺失由脚本硬校验兜底（非零退出 → job 失败 → release 门控不发）
      - name: 打包 tarball（含 README 与部署手册）
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            stage="packaging-staging/$t"
            mkdir -p "$stage"
            cp "target/$t/release/cloudmountd" "target/$t/release/cloudmount" "$stage/"
            cp README.md docs/edge.md "$stage/"
            bash scripts/package-macos.sh --bin-dir "$stage" --out . --arch "${t%%-*}"
          done
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-darwin-tarballs
          path: cloudmount-darwin-*.tar.gz
          if-no-files-found: error

  # ============ Windows MSI 安装包（installer-packages；gate1 Q2：手写 .wxs + CI 直接 WiX） ============
  # 安装面（desktop-installers A1 扩展）：三件套 cloudmountd.exe + cloudmount.exe + cloudmount-desktop.exe
  # 与 Machine PATH + 开始菜单/桌面快捷方式 + 品牌图标（.wxs 承载），SCM 注册留用户命令自管

  installer-msi-windows:
    name: Windows MSI 安装包（x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译（release，daemon + cli）
        run: cargo build --release -p cloudmount-daemon -p cloudmount-cli
      # desktop 三件套追加步（gate1 B2：installer-msi-windows 内追加，不另立 Windows job）。
      # 次序约束（prd AC3）：构建 + 归集须在既有「校验构建输入/WiX 构建」步之前——desktop exe
      # 与 icon.ico 归集入 BinDir(target/release) 后方能被 WiX 编入 MSI。
      # 独立 cargo 项目（workspace exclude）：--manifest-path 口径，产物落 apps/desktop/target。
      - name: 构建 desktop（三件套：cloudmount-desktop.exe）
        run: cargo build --release --manifest-path apps/desktop/Cargo.toml
      - name: 归集 desktop exe 与图标到 BinDir
        shell: bash
        run: |
          cp apps/desktop/target/release/cloudmount-desktop.exe target/release/
          cp apps/desktop/icons/icon.ico target/release/
      # 前置硬校验：构建输入缺失即失败（防 WiX 产出半成品 MSI；WiX 对缺失 File/@Source 天然报错为二道注记）
      # desktop-installers：校验扩三 exe（追加步产出的 desktop exe 同为构建输入）
      - name: 校验构建输入（三 exe 在位）
        shell: bash
        run: |
          test -f target/release/cloudmountd.exe
          test -f target/release/cloudmount.exe
          test -f target/release/cloudmount-desktop.exe
      # WiX 工具链（T16 已本地实证，decisions.md 2026-10-15）：WiX v3 最终线（gate1 Q2 口径；
      # WiX v4/v5 为独立 wix 包不采用）。gate2 准出回填 M1：废弃预装探测，强制安装+版本硬锁
      # （T16 实测 wixtoolset 3.14.1.20250415 / candle+light 3.14.1.8722——预装 candle 版本漂移风险）。
      # 版本来源：tag 去 v 前缀注入 ProductVersion（.wxs 不写死版本；WiX 要求数值格式，
      # rc 形态 tag 不在发布语义内，prd AC5）
      - name: WiX v3 构建 MSI（candle + light）
        shell: bash
        env:
          MSI_VERSION_SRC: ${{ github.ref_name }}
        run: |
          choco install wixtoolset --version 3.14.1.20250415 -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          command -v candle >/dev/null 2>&1 || { echo "candle 不可用：WiX v3 工具链未就绪（版本 3.14.1.20250415 硬锁）" >&2; exit 1; }
          ver="${MSI_VERSION_SRC#v}"
          case "$ver" in
            *[!0-9.]*) echo "ProductVersion 需数值格式：tag '${ver}' 含非 [0-9.] 字符（rc 不在发布语义内，AC5）" >&2; exit 1 ;;
          esac
          mkdir -p build
          candle -arch x64 -dProductVersion="$ver" -dBinDir="$(pwd -W)/target/release" packaging/wix/main.wxs -out build/main.wixobj
          light build/main.wixobj -out cloudmount-windows-x64.msi
      - name: 上传 MSI 产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-windows-msi
          path: cloudmount-windows-x64.msi
          if-no-files-found: error

  # ============ macOS pkg 安装包（installer-packages；A1/Q4：纯文件铺放 /usr/local/bin） ============
  # 无安装前/后脚本钩子、无系统服务注册（prd 非目标排除）；版本与 MSI ProductVersion 同源（M3）

  installer-pkg-macos:
    name: macOS pkg 安装包（aarch64 + x86_64 双 target）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 编译（aarch64-apple-darwin 原生）
        run: cargo build --release --target aarch64-apple-darwin -p cloudmount-daemon -p cloudmount-cli
      - name: 编译（x86_64-apple-darwin 交叉）
        run: cargo build --release --target x86_64-apple-darwin -p cloudmount-daemon -p cloudmount-cli
      # 每 target 各打一个 pkg（同名异目录产物，沿 binaries-macos 先例）；README/edge.md 不入 pkg
      # ——安装面仅 /usr/local/bin 两个二进制；脚本前置硬校验缺失即失败（不产出 → 上传兜底 error）
      - name: 打包 pkg（经 scripts/package-pkg-macos.sh，CI 与本地 dry-run 同脚本）
        env:
          PKG_VERSION_SRC: ${{ github.ref_name }}
        run: |
          ver="${PKG_VERSION_SRC#v}"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            bash scripts/package-pkg-macos.sh --bin-dir "target/$t/release" --out . --arch "${t%%-*}" --version "$ver"
          done
          test -f cloudmount-darwin-aarch64.pkg
          test -f cloudmount-darwin-x86_64.pkg
      - name: 上传 pkg 产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-darwin-pkgs
          path: |
            cloudmount-darwin-aarch64.pkg
            cloudmount-darwin-x86_64.pkg
          if-no-files-found: error

  # ============ macOS desktop .app + .dmg 安装包（desktop-installers；A1：.app 只走 .dmg） ============
  # 区别于既有 installer-pkg-macos（daemon/cli pkg，零触碰）：本 job 仅产 desktop 的 .app/.dmg。
  # aarch64-only（沿 macos-15 单 runner 先例，显式 aarch64 target；Intel mac 无 desktop 交付为已知取舍）；
  # 图标走 gen_icons 预生成入仓链（首日验证③定稿：stdlib 手写 PNG-in-ICNS，无 iconutil 依赖）

  installer-dmg-macos:
    name: macOS desktop 安装包（.app + .dmg，aarch64）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 desktop（aarch64 原生）
        run: cargo build --release --target aarch64-apple-darwin --manifest-path apps/desktop/Cargo.toml
      # CI 与本地 dry-run 同脚本；前置硬校验（binary/icns 缺失即失败不产出 → upload 兜底 error）
      - name: 打包 .app 与 .dmg（经 scripts/package-dmg-macos.sh）
        env:
          DMG_VERSION_SRC: ${{ github.ref_name }}
        run: |
          ver="${DMG_VERSION_SRC#v}"
          bash scripts/package-dmg-macos.sh \
            --bin-dir "apps/desktop/target/aarch64-apple-darwin/release" --out . --version "$ver"
      - name: 上传 dmg 产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudmount-desktop-dmg
          path: cloudmount-desktop.dmg
          if-no-files-found: error

  # ============ GitHub Release ============

  release:
    name: 创建 GitHub Release
    needs: [binaries-linux, binaries-windows, binaries-macos, installer-msi-windows, installer-pkg-macos, installer-dmg-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 下载二进制产物（只取 binaries，不含 docker digest）
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cloudmount-*
          merge-multiple: true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate-release-notes: true
          body: |
            ## CloudMount ${{ github.ref_name }}

            115 网盘同步盘（占位符挂载 + 边缘网关），AGPL-3.0。

            ### 产物
            | 文件 | 平台 | 内容 |
            |---|---|---|
            | `cloudmount-linux-*-musl.tar.gz` | Linux x64 / arm64 | 静态二进制（daemon + CLI）+ systemd unit + 部署手册 |
            | `cloudmount-windows-x64.zip` | Windows x64 | cloudmountd.exe + cloudmount.exe |
            | `cloudmount-darwin-aarch64.tar.gz` | macOS arm64 | 静态二进制（daemon + CLI）+ README + 部署手册 |
            | `cloudmount-darwin-x86_64.tar.gz` | macOS x64 | 静态二进制（daemon + CLI）+ README + 部署手册 |
            | `cloudmount-windows-x64.msi` | Windows x64 | 安装包（MSI）：daemon + CLI + desktop（egui 界面 + 托盘）→ `Program Files\CloudMount` + Machine PATH + 开始菜单/桌面快捷方式 |
            | `cloudmount-darwin-aarch64.pkg` | macOS arm64 | 安装包（pkg）：daemon + CLI → `/usr/local/bin` |
            | `cloudmount-darwin-x86_64.pkg` | macOS x64 | 安装包（pkg）：daemon + CLI → `/usr/local/bin` |
            | `cloudmount-desktop.dmg` | macOS arm64 | desktop 应用（CloudMount.app：egui 界面 + 托盘）拖拽安装至 `/Applications`（aarch64-only）；未签名：首启若被 Gatekeeper 拦截，右键→打开为预期解除方式 |

            mac 产物无 Developer ID 签名/公证（arm64 产物为链接器 ad-hoc 签名，Apple Silicon 运行所需）；首启若被 Gatekeeper 拦截：`xattr -cr <解压后的二进制>` 或右键→打开。
            Windows MSI 无 Authenticode 签名：首启若被 SmartScreen 拦截，「更多信息→仍要运行」为预期行为；请仅从本仓库 Release 页下载。
            mac pkg 无 Developer ID 签名/公证：首启若被 Gatekeeper 拦截，右键→打开或 `xattr -cr <pkg>` 为预期解除方式。
            安装提示：MSI 为 per-machine 安装，UAC 提权为预期；PATH 写入对**新开终端**生效（已开窗口需重开）；升级安装请**先卸载再装**（升级语义不设计不保证）。

            ### 快速开始
            ```bash
            # Linux 边缘网关（WebDAV 出口）
            ./cloudmountd --serve --listen 0.0.0.0:8384 --auth user:pass

            # Windows 占位符挂载（OneDrive 式按需）
            cloudmountd --placeholder-mount --sync-root D:\Cloud
            ```

            Docker：`docker run -p 8384:8384 ghcr.io/tintac-cn/cloudmount:${{ github.ref_name }}`

            详见 [部署手册](https://github.com/${{ github.repository }}/blob/main/docs/edge.md)。

  # ============ Docker 多架构镜像（GHCR） ============

  docker:
    name: Docker 镜像（${{ matrix.platform }}）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # GHCR 要求小写仓库名（owner 可能含大写）
      - name: 镜像名（小写）
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudmount" >> "$GITHUB_OUTPUT"
      # release 干净构建：不用 rust-cache（缓存恢复的宿主构建脚本曾在
      # cross 容器里 glibc 不兼容连坐失败）
      - uses: taiki-e/install-action@cross
      - name: 交叉编译静态产物
        run: |
          cross build -p cloudmount-daemon -p cloudmount-cli \
            --target ${{ matrix.target }} --release
      # web-ui 静态资产（Dockerfile COPY web-ui/dist）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: 构建 web-ui
        run: cd web-ui && (npm ci || npm install) && npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（按架构）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传 digest（供合并清单）
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: 合并多架构清单
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 下载 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建并推送合并清单
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudmount"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
