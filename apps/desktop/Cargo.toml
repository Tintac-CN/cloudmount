[package]
name = "cloudmount-desktop"
description = "CloudMount 桌面应用（纯 Rust：egui + wgpu + rfd，无 WebView）"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Tintac-CN/cloudmount"

# 独立项目：不参与 cloudmount workspace（根 Cargo.toml exclude）

[dependencies]
# GUI：eframe（egui 框架）+ wgpu 渲染后端
eframe = { version = "0.31", features = ["wgpu"] }
# 原生文件/目录选择对话框
rfd = "0.15"
# 二维码渲染（登录页）
qrcode = { version = "0.14", default-features = false }
# 引擎（同进程库链接）
cloudmount-core = { path = "../../crates/cloudmount-core" }
cloudmount-auth = { path = "../../crates/cloudmount-auth" }
cloudmount-driver115 = { path = "../../crates/cloudmount-driver115" }
cloudmount-sync = { path = "../../crates/cloudmount-sync" }
# 系统托盘
tray-icon = "0.21"
# 平台窗口句柄（RawWindowHandle——Windows 伪隐藏切换 WS_EX_TOOLWINDOW 取 HWND，
# 见 src/main.rs「系统托盘」段：真隐藏的 WM_PAINT 帧饥饿/事件循环自旋实测约束）
raw-window-handle = "0.6"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde_json = "1"

[build-dependencies]
# exe 图标资源嵌入（首日验证② 选型定稿）：选 winresource 而非 winres——
# winres 停更于 0.1.12（2021-09-28，~5 年无更新）；winresource 为活跃维护继任
# （0.1.34，2026-10-12 发版），WindowsResource API 兼容、同 Cargo 集成语义。
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
