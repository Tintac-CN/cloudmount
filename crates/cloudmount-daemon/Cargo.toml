[package]
name = "cloudmount-daemon"
description = "常驻服务：同步引擎 + 挂载后端 + WebDAV 边缘出口（低内存目标 5–15MB）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cloudmountd"
path = "src/main.rs"

[features]
## mock：内置 MockRemote 云端（免凭据验证占位符挂载链路）
mock = ["cloudmount-sync/testutil"]

[dependencies]
# WebDAV 出口（M4 边缘网关；hyper 为承载 HTTP 服务）
dav-server = "0.5"
hyper = { version = "0.14", features = ["http1", "server", "runtime", "stream", "client"] }
futures-util = "0.3"
# TLS（--tls-cert/--tls-key；rustls 纯 Rust，musl 友好）
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1"
bytes = "1"
base64.workspace = true
cloudmount-core = { path = "../cloudmount-core" }
cloudmount-vfs = { path = "../cloudmount-vfs" }
cloudmount-auth = { path = "../cloudmount-auth" }
cloudmount-driver115 = { path = "../cloudmount-driver115" }
cloudmount-sync = { path = "../cloudmount-sync" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
cloudmount-sync = { path = "../cloudmount-sync", features = ["testutil"] }
