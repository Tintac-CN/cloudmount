[package]
name = "cloudmount-sync"
description = "双向同步引擎：本地/远端变更发现、三向对比、队列调度、块缓存"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
## testutil：导出 MockRemote 内存远端（供其它 crate 的集成测试复用）
testutil = []

[dependencies]
cloudmount-core = { path = "../cloudmount-core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
sha1.workspace = true
hex.workspace = true
filetime.workspace = true

# Windows 原生 watcher（ReadDirectoryChangesW）
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Linux 原生 watcher（inotify）
[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"
