<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudMount 云挂</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        --fg: light-dark(#1a1a1a, #eee);
        --muted: light-dark(#666, #999);
        --border: light-dark(#ddd, #333);
        --accent: light-dark(#0066cc, #4d9fff);
        --bar-track: light-dark(#eee, #222);
        --bar-fill: light-dark(#0066cc, #4d9fff);
      }
      body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: var(--fg); }
      h1 { margin-bottom: 0.25rem; }
      h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--muted); }
      .muted { color: var(--muted); font-size: 0.875rem; }
      nav { display: flex; gap: 0.5rem; margin: 1rem 0; }
      nav button { flex: 0; }
      nav button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      button {
        font: inherit; padding: 0.4rem 1rem; border-radius: 6px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.6; cursor: wait; }
      input {
        font: inherit; padding: 0.4rem 0.6rem; border-radius: 6px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
        width: 100%; box-sizing: border-box; margin-bottom: 0.5rem;
      }
      ul { list-style: none; padding: 0; }
      li {
        display: flex; justify-content: space-between; padding: 0.35rem 0;
        border-bottom: 1px solid var(--border);
      }
      li span { color: var(--muted); }
      .bar {
        position: relative; height: 1.25rem; border-radius: 6px;
        background: var(--bar-track); overflow: hidden; margin: 0.5rem 0;
      }
      .bar-fill { height: 100%; background: var(--bar-fill); transition: width 0.3s; }
      .bar-label {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; font-size: 0.8rem; font-weight: 600;
        mix-blend-mode: difference; color: #fff;
      }
      section > div { margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
